<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Lists</title>
</head>
<body>
  <h1>Types of Lists</h1>
  <h2>Ordered List</h2>
  <ol><li>Plan the page</li><li>Write the HTML</li><li>Test the result</li></ol>
  <h2>Unordered List</h2>
  <ul><li>HTML</li><li>CSS</li><li>JavaScript</li></ul>
  <h2>Description List</h2>
  <dl>
    <dt>HTML</dt><dd>The language used to structure webpages.</dd>
    <dt>CSS</dt><dd>The language used to style webpages.</dd>
  </dl>
</body>
</html>
