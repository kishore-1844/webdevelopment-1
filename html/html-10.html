<!-- HTML 10: College timetable using an HTML table -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Timetable</title>
  <style>table, th, td { border: 1px solid #333; border-collapse: collapse; padding: 12px; text-align: center; } th { background: #dbeafe; }</style>
</head>
<body>
  <h1>College Timetable</h1>
  <table>
    <thead><tr><th>Time</th><th>Monday</th><th>Tuesday</th><th>Wednesday</th><th>Thursday</th><th>Friday</th></tr></thead>
    <tbody><tr><th>9:00 - 10:00</th><td>Math</td><td>Physics</td><td>Chemistry</td><td>English</td><td>Computer</td></tr><tr><th>10:00 - 11:00</th><td>English</td><td>Math</td><td>Biology</td><td>Computer</td><td>Physics</td></tr><tr><th>11:00 - 12:00</th><td colspan="5">Break</td></tr></tbody>
  </table>
</body>
</html>
