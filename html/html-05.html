<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Registration</title></head>
<body>
  <h1>Student Registration Form</h1>
  <form action="#" method="post">
    <label for="name">Full name:</label><input id="name" name="name" type="text" required><br><br>
    <label for="email">Email:</label><input id="email" name="email" type="email" required><br><br>
    <label for="course">Course:</label><select id="course" name="course"><option>BCA</option><option>BBA</option><option>BSc</option></select><br><br>
    <label for="address">Address:</label><br><textarea id="address" name="address" rows="4" cols="35"></textarea><br><br>
    <label><input type="checkbox" name="terms" required> I agree to the terms.</label><br><br>
    <button type="submit">Register</button>
  </form>
</body>
</html>
