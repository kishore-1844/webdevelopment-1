<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table with Merged Cells</title>
  <style>table, th, td { border: 1px solid #333; border-collapse: collapse; padding: 10px; } th { background: #dbeafe; }</style>
</head>
<body>
  <h1>Student Marks</h1>
  <table>
    <thead><tr><th rowspan="2">Student</th><th colspan="2">Marks</th><th rowspan="2">Total</th></tr><tr><th>HTML</th><th>CSS</th></tr></thead>
    <tbody><tr><td>Riya</td><td>45</td><td>48</td><td>93</td></tr><tr><td>Aman</td><td>42</td><td>44</td><td>86</td></tr></tbody>
    <tfoot><tr><th colspan="3">Class average</th><th>89.5</th></tr></tfoot>
  </table>
</body>
</html>
