<!-- HTML 11: Internal and external CSS styling -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internal and External CSS</title>
  <link rel="stylesheet" href="html-11-style.css">
  <style>
    .internal-note { color: #1d4ed8; padding: 12px; border: 2px solid #93c5fd; }
  </style>
</head>
<body>
  <h1>CSS Styling Sources</h1>
  <p class="external-note">This paragraph is styled by the external stylesheet.</p>
  <p class="internal-note">This paragraph is styled by the internal style element.</p>
</body>
</html>
