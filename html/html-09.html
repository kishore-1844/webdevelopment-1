<!-- HTML 9: HTML5 input types such as email, date, number, and password -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML5 Input Types</title>
</head>
<body>
  <h1>HTML5 Input Types</h1>
  <form>
    <label>Email: <input type="email" name="email" required></label><br><br>
    <label>Date of birth: <input type="date" name="dob"></label><br><br>
    <label>Age: <input type="number" name="age" min="16" max="100"></label><br><br>
    <label>Password: <input type="password" name="password" minlength="8" required></label><br><br>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
