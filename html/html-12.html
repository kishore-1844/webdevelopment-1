<!-- HTML 12: CSS selectors, colors, fonts, margins, padding, and borders -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Selectors and Properties</title>
  <style>
    body { font-family: Georgia, serif; color: #1f2937; margin: 30px; background: #f8fafc; }
    h1 { color: #7c3aed; }
    .card { margin: 20px; padding: 20px; border: 3px solid #c4b5fd; background: white; }
    #important { color: #be123c; font-weight: bold; }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <h1>CSS Selector Demonstration</h1>
  <div class="card">
    <h2>Class Selector</h2>
    <p id="important">ID selector: this text is highlighted.</p>
    <p>Element selectors style all matching elements.</p>
  </div>
</body>
</html>
