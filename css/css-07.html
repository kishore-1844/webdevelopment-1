<!-- CSS 7: Linear and Radial CSS gradients -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gradient Examples</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    .linear {
      height: 200px;
      background: linear-gradient(to right, #2563eb, #7c3aed, #ec4899);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }
    .radial {
      margin-top: 20px;
      height: 200px;
      background: radial-gradient(circle, #fef3c7, #f59e0b, #b45309);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="linear">Linear Gradient</div>
  <div class="radial">Radial Gradient</div>
</body>
</html>
