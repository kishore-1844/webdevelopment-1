<!-- CSS 25: CSS outline and outline-offset properties -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outline Example</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .box {
      width: 200px;
      padding: 20px;
      outline: 3px solid #2563eb;
      outline-offset: 8px;
      background: #eff6ff;
    }
  </style>
</head>
<body>
  <div class="box">Outlined Box</div>
</body>
</html>
