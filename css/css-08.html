<!-- CSS 8: CSS font-family, font-size, font-weight, font-style, and font-variant properties -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Font Styling</title>
  <style>
    body { font-family: Arial, sans-serif; }
    h1 { font-size: 2.5rem; font-weight: bold; }
    .italic { font-style: italic; }
    .smallcaps { font-variant: small-caps; }
  </style>
</head>
<body>
  <h1>Font Properties</h1>
  <p class="italic">This is italic text.</p>
  <p class="smallcaps">This text uses small caps style.</p>
</body>
</html>
