<!-- CSS 14: CSS visibility and opacity properties -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visibility and Opacity</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .visible { visibility: visible; background: #dcfce7; padding: 20px; }
    .hidden { visibility: hidden; background: #fee2e2; padding: 20px; }
    .semi { opacity: 0.5; background: #dbeafe; padding: 20px; }
  </style>
</head>
<body>
  <div class="visible">Visible element</div><br />
  <div class="hidden">Hidden element</div><br />
  <div class="semi">Semi-transparent element</div>
</body>
</html>
