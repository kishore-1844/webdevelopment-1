<!-- CSS 33: CSS 3D transformations and perspective effects -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Transform</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 60px; perspective: 800px; }
    .cube {
      width: 150px;
      height: 150px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotateX(35deg) rotateY(30deg);
      border-radius: 12px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div class="cube">3D</div>
</body>
</html>
