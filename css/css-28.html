<!-- CSS 28: CSS em, rem, vw, vh, and percentage units -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Units</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .em-box { font-size: 1.5em; padding: 1em; background: #dbeafe; }
    .rem-box { font-size: 1.5rem; padding: 1rem; background: #dcfce7; }
    .vw-box { width: 50vw; height: 20vh; background: #fef3c7; }
    .percent-box { width: 60%; background: #fce7f3; padding: 20px; }
  </style>
</head>
<body>
  <div class="em-box">em unit example</div>
  <div class="rem-box">rem unit example</div>
  <div class="vw-box">vw and vh example</div>
  <div class="percent-box">percentage example</div>
</body>
</html>
