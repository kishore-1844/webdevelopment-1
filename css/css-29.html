<!-- CSS 29: CSS object-fit and object-position properties -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Object Fit</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      object-position: center;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Cover example" />
</body>
</html>
