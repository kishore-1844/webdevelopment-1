<!-- CSS 32: CSS 2D transformations such as rotate, scale, translate, and skew -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Transform</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; }
    .box {
      width: 180px;
      padding: 20px;
      background: #7c3aed;
      color: white;
      transform: rotate(15deg) scale(1.1) translate(10px, 5px) skewX(10deg);
      display: inline-block;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="box">Transformed box</div>
</body>
</html>
