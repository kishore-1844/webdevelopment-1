<!-- CSS 2: Webpage using Universal, Element, Class, ID, Attribute, and Grouping selectors -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Selectors</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: blue; }
    .box { background: #e0f2fe; padding: 12px; margin: 10px 0; }
    #intro { color: green; }
    input[type="text"] { border: 2px solid red; }
    h2, p { line-height: 1.6; }
  </style>
</head>
<body>
  <h1>Welcome</h1>
  <p id="intro">This paragraph uses an ID selector.</p>
  <div class="box">This div uses a class selector.</div>
  <h2>Selector Example</h2>
  <p>This paragraph uses grouped selector styling.</p>
  <input type="text" value="Sample text" />
</body>
</html>
