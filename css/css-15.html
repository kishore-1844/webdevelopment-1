<!-- CSS 15: CSS overflow, overflow-x, and overflow-y properties -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overflow Example</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .box {
      width: 200px;
      height: 100px;
      border: 2px solid #111827;
      overflow: auto;
      padding: 10px;
      background: #f3f4f6;
    }
  </style>
</head>
<body>
  <div class="box">
    This is a long text example. This text continues and may overflow the box. This is a long text example. This text continues and may overflow the box.
  </div>
</body>
</html>
