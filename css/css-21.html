<!-- CSS 21: CSS static, relative, absolute, fixed, and sticky positioning -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Positioning</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; height: 200vh; }
    .static { position: static; background: #dbeafe; padding: 10px; }
    .relative { position: relative; left: 30px; background: #dcfce7; padding: 10px; }
    .absolute-wrap { position: relative; height: 100px; background: #fee2e2; margin-top: 20px; }
    .absolute { position: absolute; right: 20px; top: 20px; background: #fef3c7; padding: 10px; }
    .fixed { position: fixed; bottom: 20px; right: 20px; background: #111827; color: white; padding: 10px 20px; }
    .sticky { position: sticky; top: 0; background: #c7d2fe; padding: 10px; }
  </style>
</head>
<body>
  <div class="sticky">Sticky Header</div>
  <div class="static">Static element</div>
  <div class="relative">Relative positioned element</div>
  <div class="absolute-wrap">
    <div class="absolute">Absolute positioned</div>
  </div>
  <div class="fixed">Fixed button</div>
</body>
</html>
