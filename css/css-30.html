<!-- CSS 30: CSS filters such as blur, grayscale, brightness, contrast, and opacity -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Filters</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    img {
      width: 300px;
      margin-right: 20px;
      filter: blur(1px) grayscale(0.6) brightness(1.1) contrast(1.2) opacity(0.8);
    }
  </style>
</head>
<body>
  <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=800&q=80" alt="Filtered image" />
</body>
</html>
