<!-- CSS 9: CSS text alignment, decoration, transformation, indentation, spacing, and line-height -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Styling</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.8; padding: 30px; }
    h1 { text-align: center; text-transform: uppercase; }
    p { text-indent: 30px; letter-spacing: 1px; }
    .underline { text-decoration: underline; }
    .uppercase { text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>Text Styling</h1>
  <p class="underline">This paragraph has an underline.</p>
  <p class="uppercase">This paragraph uses uppercase transformation.</p>
</body>
</html>
