<!-- CSS 6: Different CSS border styles, widths, colors, and border-radius properties -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Border Examples</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .one { border: 3px solid red; border-radius: 10px; padding: 20px; }
    .two { border: 5px dashed blue; border-radius: 20px; padding: 20px; }
    .three { border: 4px double green; border-radius: 50px; padding: 20px; }
  </style>
</head>
<body>
  <div class="one">Solid border</div><br />
  <div class="two">Dashed border</div><br />
  <div class="three">Rounded border</div>
</body>
</html>
