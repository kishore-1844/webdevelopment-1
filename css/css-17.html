<!-- CSS 17: CSS box-shadow and text-shadow properties -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadows</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .card {
      width: 220px;
      padding: 20px;
      background: white;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      border-radius: 12px;
    }
    h1 {
      text-shadow: 2px 2px 4px #64748b;
    }
  </style>
</head>
<body>
  <h1>Shadow Example</h1>
  <div class="card">Card with box shadow</div>
</body>
</html>
