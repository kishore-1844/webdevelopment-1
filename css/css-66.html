<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tooltip</title><link rel="stylesheet" href="css-components.css"><style>.tip{position:relative}.tip span{display:none;position:absolute;bottom:calc(100% + 8px);left:0;background:#172033;color:#fff;padding:7px 10px;border-radius:6px;white-space:nowrap}.tip:hover span{display:block}</style></head><body><main><h1>Tooltip Component</h1><button class="tip">Hover for details<span>Last synced 2 minutes ago</span></button></main></body></html>
