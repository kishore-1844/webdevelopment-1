<!-- CSS 16: Border-radius to create rounded cards, circles, pills, and custom shapes -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Border Radius</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .card { width: 200px; background: #dbeafe; padding: 20px; border-radius: 20px; }
    .circle { width: 100px; height: 100px; background: #f9a8d4; border-radius: 50%; text-align: center; line-height: 100px; }
    .pill { display: inline-block; background: #bbf7d0; padding: 10px 18px; border-radius: 999px; }
  </style>
</head>
<body>
  <div class="card">Rounded card</div><br />
  <div class="circle">O</div><br />
  <div class="pill">Pill button</div>
</body>
</html>
