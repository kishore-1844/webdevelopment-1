<!-- CSS 4: Webpage using CSS colors for text, backgrounds, borders, and UI elements -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Colors</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; margin: 30px; }
    h1 { color: #2563eb; }
    .card { background: #e0f2fe; border: 3px solid #0ea5e9; padding: 20px; color: #111827; border-radius: 12px; }
    .button { background: #22c55e; color: white; padding: 10px 18px; border-radius: 8px; border: none; }
  </style>
</head>
<body>
  <h1>CSS Color Example</h1>
  <div class="card">
    This card uses a light blue background and blue border.
  </div>
  <button class="button">Click Me</button>
</body>
</html>
