<!-- CSS 22: CSS z-index and stacking order -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Z Index</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .box {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .one { background: #bfdbfe; z-index: 1; }
    .two { background: #bbf7d0; position: relative; left: 30px; top: -50px; z-index: 2; }
    .three { background: #fbcfe8; position: relative; left: 60px; top: -110px; z-index: 3; }
  </style>
</head>
<body>
  <div class="box one">Layer 1</div>
  <div class="box two">Layer 2</div>
  <div class="box three">Layer 3</div>
</body>
</html>
