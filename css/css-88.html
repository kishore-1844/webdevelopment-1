<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Validation</title><link rel="stylesheet" href="css-components.css"></head><body><main><h1>Form Validation and Errors</h1><form class="card" novalidate><div class="field"><label for="email">Email</label><input id="email" type="email" value="not-an-email" aria-invalid="true" aria-describedby="email-error"><span id="email-error" class="error">Please enter a valid email address.</span></div><div class="field"><label for="name">Name</label><input id="name" type="text" aria-invalid="true" aria-describedby="name-error"><span id="name-error" class="error">Name is required.</span></div><button type="submit">Submit form</button></form></main></body></html>
