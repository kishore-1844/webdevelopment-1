<!-- CSS 23: CSS float and clear properties -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Float Example</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .left { float: left; width: 150px; background: #dbeafe; padding: 20px; }
    .right { float: right; width: 150px; background: #dcfce7; padding: 20px; }
    .clear { clear: both; background: #fef3c7; padding: 10px; }
  </style>
</head>
<body>
  <div class="left">Float Left</div>
  <div class="right">Float Right</div>
  <div class="clear">This clears the float.</div>
</body>
</html>
