<!-- CSS 26: CSS margin, padding, and spacing utilities -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spacing Example</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .box {
      background: #dbeafe;
      padding: 20px;
      margin: 20px;
      border: 2px solid #2563eb;
    }
  </style>
</head>
<body>
  <div class="box">Spacing example using margin and padding.</div>
</body>
</html>
