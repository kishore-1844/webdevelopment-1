<!-- CSS 10: CSS box model with content, padding, border, and margin -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Model</title>
  <style>
    .box {
      width: 300px;
      padding: 20px;
      border: 5px solid #2563eb;
      margin: 30px;
      background: #eff6ff;
    }
  </style>
</head>
<body>
  <div class="box">This is a box model example.</div>
</body>
</html>
