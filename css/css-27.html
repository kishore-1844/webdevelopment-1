<!-- CSS 27: CSS width and height percentages, viewport units, and rem units -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Units Example</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .percent { width: 50%; background: #dbeafe; padding: 20px; }
    .viewport { width: 80vw; background: #dcfce7; padding: 20px; margin-top: 20px; }
    .rem { font-size: 1.5rem; background: #fef3c7; padding: 20px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="percent">50% width</div>
  <div class="viewport">80vw width</div>
  <div class="rem">This uses rem font size.</div>
</body>
</html>
