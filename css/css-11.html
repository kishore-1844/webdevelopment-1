<!-- CSS 11: Different width, height, min-width, max-width, min-height, and max-height properties -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dimension Properties</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .box {
      width: 300px;
      height: 120px;
      min-width: 200px;
      max-width: 500px;
      min-height: 80px;
      max-height: 200px;
      background: #dcfce7;
      border: 2px solid #16a34a;
      padding: 15px;
    }
  </style>
</head>
<body>
  <div class="box">This box demonstrates width and height constraints.</div>
</body>
</html>
