<!-- CSS 24: CSS cursor styles and pointer interactions -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursors</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .pointer { cursor: pointer; background: #dbeafe; padding: 12px; margin-bottom: 10px; }
    .crosshair { cursor: crosshair; background: #dcfce7; padding: 12px; margin-bottom: 10px; }
    .wait { cursor: wait; background: #fef3c7; padding: 12px; }
  </style>
</head>
<body>
  <div class="pointer">Pointer cursor</div>
  <div class="crosshair">Crosshair cursor</div>
  <div class="wait">Wait cursor</div>
</body>
</html>
