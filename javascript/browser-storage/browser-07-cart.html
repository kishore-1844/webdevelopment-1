<!doctype html><html><head><meta charset="UTF-8"><title>Persistent Cart</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Shopping Cart with LocalStorage</h1><button onclick="add('Notebook')">Add notebook</button><button onclick="add('Headphones')">Add headphones</button><ul id="out"></ul></main><script>let cart=JSON.parse(localStorage.cart||'[]');function add(x){cart.push(x);localStorage.cart=JSON.stringify(cart);render()}function render(){out.innerHTML=cart.map(x=>`<li>${x}</li>`).join('')||'<li>Cart is empty</li>'}render()</script></body></html>
