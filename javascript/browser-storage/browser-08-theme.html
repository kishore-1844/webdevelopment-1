<!doctype html><html><head><meta charset="UTF-8"><title>Saved Theme</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Light and Dark Theme Switcher</h1><section class="panel"><button onclick="toggle()">Toggle theme</button><p>Preference is saved in localStorage.</p></section></main><script>function toggle(){document.body.classList.toggle('dark');localStorage.theme=document.body.classList.contains('dark')?'dark':'light'}if(localStorage.theme==='dark')document.body.classList.add('dark')</script></body></html>
