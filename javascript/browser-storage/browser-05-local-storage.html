<!doctype html><html><head><meta charset="UTF-8"><title>Local Storage</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>LocalStorage Program</h1><input id="value" placeholder="Value"><button onclick="localStorage.setItem('note',value.value);show()">Save</button><button onclick="show()">Read</button><p id="out" class="output"></p></main><script>function show(){out.textContent=localStorage.getItem('note')||'No saved value'}</script></body></html>
