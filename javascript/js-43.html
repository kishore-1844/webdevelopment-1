<!doctype html><html><head><meta charset="UTF-8"><title>Fetch API</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Fetch Data from an API</h1><button onclick="load()">Fetch post</button><p id="out" class="output"></p></main><script>async function load(){const r=await fetch('https://jsonplaceholder.typicode.com/posts/1');const d=await r.json();out.textContent=d.title}</script></body></html>
