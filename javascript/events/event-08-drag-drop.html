<!doctype html><html><head><meta charset="UTF-8"><title>Drag and Drop</title><link rel="stylesheet" href="../dom-lab.css"><style>#drag{padding:20px;background:#dbeafe;width:150px}#drop{padding:40px;border:2px dashed #2563eb;margin-top:20px}</style></head><body><main><h1>Drag-and-drop Application</h1><div id="drag" draggable="true">Drag me</div><div id="drop">Drop here</div><p id="out" class="output"></p></main><script>drag.ondragstart=e=>e.dataTransfer.setData('text','drag');drop.ondragover=e=>e.preventDefault();drop.ondrop=()=>out.textContent='Dropped successfully'</script></body></html>
