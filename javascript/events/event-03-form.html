<!doctype html><html><head><meta charset="UTF-8"><title>Form Events</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Form Events</h1><form id="form" class="panel" onsubmit="event.preventDefault();out.textContent='Submitted'"><input onfocus="out.textContent='Focused'" onblur="out.textContent='Blurred'" onchange="out.textContent='Changed'" placeholder="Type here"><button>Submit</button><p id="out" class="output"></p></form></main></body></html>
