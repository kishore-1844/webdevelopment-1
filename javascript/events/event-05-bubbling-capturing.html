<!doctype html><html><head><meta charset="UTF-8"><title>Bubbling Capturing</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Event Bubbling and Capturing</h1><div id="outer" class="panel"><button id="inner">Click inner button</button></div><p id="out" class="output"></p></main><script>outer.addEventListener('click',()=>out.textContent+=' Bubbling: outer',false);outer.addEventListener('click',()=>out.textContent='Capturing: outer',true);inner.onclick=()=>out.textContent+=' Inner'</script></body></html>
