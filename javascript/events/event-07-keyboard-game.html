<!doctype html><html><head><meta charset="UTF-8"><title>Keyboard Game</title><link rel="stylesheet" href="../dom-lab.css"><style>#player{position:relative;left:0;background:#2563eb;color:#fff;padding:14px;width:80px}</style></head><body><main><h1>Keyboard-controlled Game</h1><p>Use the arrow keys.</p><div id="player">Player</div></main><script>let x=0;document.onkeydown=e=>{if(e.key==='ArrowRight')x+=10;if(e.key==='ArrowLeft')x-=10;player.style.left=x+'px'}</script></body></html>
