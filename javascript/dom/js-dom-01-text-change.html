<!-- DOM 1: Change text content of an HTML element using JavaScript. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOM Text Change</title>
</head>
<body>
  <p id="msg">Original text</p>
  <button onclick="document.getElementById('msg').textContent='Updated text'">Change Text</button>
</body>
</html>
