<!doctype html><html><head><meta charset="UTF-8"><title>Stopwatch</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Stopwatch</h1><section class="panel"><div id="time" class="output">0 seconds</div><button onclick="start()">Start</button><button onclick="clearInterval(timer)">Stop</button><button onclick="time.textContent='0 seconds'">Reset</button></section></main><script>let seconds=0,timer;function start(){clearInterval(timer);timer=setInterval(()=>time.textContent=++seconds+' seconds',1000)}</script></body></html>
