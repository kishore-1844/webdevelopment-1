<!doctype html><html><head><meta charset="UTF-8"><title>Registration Form</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Student Registration Validation</h1><form id="f" class="panel"><input id="name" placeholder="Name" required><input id="email" type="email" placeholder="Email" required><button>Register</button><p id="out" class="output"></p></form></main><script>f.onsubmit=e=>{e.preventDefault();out.textContent=f.checkValidity()?'Valid registration':'Complete all fields'}</script></body></html>
