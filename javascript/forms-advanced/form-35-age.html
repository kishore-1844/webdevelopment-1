<!doctype html><html><head><meta charset="UTF-8"><title>Age from DOB</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Calculate Age from Date of Birth</h1><input id="dob" type="date" onchange="out.textContent=new Date().getFullYear()-new Date(dob.value).getFullYear()+' years old'"><p id="out" class="output"></p></main></body></html>
