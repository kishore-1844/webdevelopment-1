<!doctype html><html><head><meta charset="UTF-8"><title>Dynamic Fields</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Dynamic Fields by Selection</h1><select onchange="extra.hidden=this.value!=='yes'"><option value="no">No extra details</option><option value="yes">Add details</option></select><input id="extra" hidden placeholder="Extra details"><p class="output">Choose an option.</p></main></body></html>
