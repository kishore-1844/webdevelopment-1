<!doctype html><html><head><meta charset="UTF-8"><title>Password Regex</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Password Regex Validation</h1><input id="pass" type="password"><button onclick="out.textContent=/^(?=.*[A-Z])(?=.*\d).{8,}$/.test(pass.value)?'Valid password':'Need 8 chars, uppercase, number'">Check</button><p id="out" class="output"></p></main></body></html>
