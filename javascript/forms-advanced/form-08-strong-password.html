<!doctype html><html><head><meta charset="UTF-8"><title>Strong Password</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Strong Password Validator</h1><input id="pass" type="password" oninput="out.textContent=/^(?=.*[A-Z])(?=.*\d)(?=.*\W).{8,}$/.test(pass.value)?'Strong':'Add uppercase, number, symbol, and length'"><p id="out" class="output"></p></main></body></html>
