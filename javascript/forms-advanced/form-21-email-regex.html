<!doctype html><html><head><meta charset="UTF-8"><title>Email Regex</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Email Regex Validation</h1><input id="email"><button onclick="out.textContent=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)?'Valid':'Invalid'">Check</button><p id="out" class="output"></p></main></body></html>
