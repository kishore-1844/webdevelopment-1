<!doctype html><html><head><meta charset="UTF-8"><title>Name Validation</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Name accepts alphabets only</h1><input id="name" oninput="out.textContent=/^[A-Za-z ]+$/.test(name.value)?'Valid name':'Letters only'"><p id="out" class="output"></p></main></body></html>
