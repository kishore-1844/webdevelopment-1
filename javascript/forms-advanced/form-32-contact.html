<!doctype html><html><head><meta charset="UTF-8"><title>Contact Validation</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Contact Form Validation</h1><form id="f" class="panel"><input required placeholder="Name"><input required type="email" placeholder="Email"><textarea required placeholder="Message"></textarea><button>Contact us</button><p id="out" class="output"></p></form></main><script>f.onsubmit=e=>{e.preventDefault();out.textContent=f.checkValidity()?'Message sent':'Complete the form'}</script></body></html>
