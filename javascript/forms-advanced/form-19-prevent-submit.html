<!doctype html><html><head><meta charset="UTF-8"><title>Prevent Submit</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Prevent Submission on Failure</h1><form onsubmit="if(!email.value.includes('@')){event.preventDefault();out.textContent='Submission prevented'}"><input id="email" placeholder="Email"><button>Submit</button><p id="out" class="output"></p></form></main></body></html>
