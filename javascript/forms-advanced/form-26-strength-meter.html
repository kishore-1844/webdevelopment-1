<!doctype html><html><head><meta charset="UTF-8"><title>Password Meter</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Password Strength Meter</h1><input id="pass" type="password" oninput="meter.style.width=Math.min(pass.value.length*10,100)+'%'"><div style="background:#e2e8f0;height:12px"><div id="meter" style="height:100%;background:#16a34a;width:0"></div></div></main></body></html>
