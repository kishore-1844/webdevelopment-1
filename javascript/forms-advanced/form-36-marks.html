<!doctype html><html><head><meta charset="UTF-8"><title>Marks Calculator</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Marks, Average, and Grade</h1><input id="a" type="number" value="80"><input id="b" type="number" value="90"><button onclick="calc()">Calculate</button><p id="out" class="output"></p></main><script>function calc(){let avg=(+a.value+ +b.value)/2;out.textContent=`Total: ${+a.value+ +b.value}, Average: ${avg}, Grade: ${avg>=90?'A':avg>=75?'B':'C'}`}</script></body></html>
