<!doctype html><html><head><meta charset="UTF-8"><title>Login</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Login Validation</h1><form id="f" class="panel"><input id="user" required placeholder="Username"><input id="pass" type="password" minlength="8" required placeholder="Password"><button>Login</button><p id="out" class="output"></p></form></main><script>f.onsubmit=e=>{e.preventDefault();out.textContent=f.checkValidity()?'Login valid':'Invalid credentials'}</script></body></html>
