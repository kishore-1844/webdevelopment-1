<!doctype html><html><head><meta charset="UTF-8"><title>Spread Rest</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Spread and Rest Operators</h1><p id="out" class="output"></p></main><script>const first=[1,2],all=[...first,3,4];function total(...values){return values.reduce((a,n)=>a+n,0)}out.textContent=`Spread: ${all.join(', ')} | Rest total: ${total(...all)}`</script></body></html>
