<!-- JavaScript 10: Reverse a number. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reverse Number</title>
</head>
<body>
  <script>
    let n = 12345;
    let reverse = 0;

    while (n > 0) {
      reverse = reverse * 10 + (n % 10);
      n = Math.floor(n / 10);
    }

    document.write("Reversed number: " + reverse);
  </script>
</body>
</html>
