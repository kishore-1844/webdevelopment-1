<!-- JavaScript 3: Find the largest of three numbers. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Largest of Three</title>
</head>
<body>
  <script>
    let a = 15, b = 30, c = 22;
    let largest = a;

    if (b > largest) largest = b;
    if (c > largest) largest = c;

    document.write("Largest number: " + largest);
  </script>
</body>
</html>
