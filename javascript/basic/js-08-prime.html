<!-- JavaScript 8: Check whether a number is prime. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prime Number</title>
</head>
<body>
  <script>
    let n = 13;
    let isPrime = true;

    if (n <= 1) isPrime = false;
    for (let i = 2; i * i <= n; i++) {
      if (n % i === 0) {
        isPrime = false;
        break;
      }
    }

    document.write(isPrime ? n + " is prime" : n + " is not prime");
  </script>
</body>
</html>
