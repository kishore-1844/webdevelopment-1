<!-- JavaScript 5: Check whether a number is positive, negative, or zero. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Positive Negative Zero</title>
</head>
<body>
  <script>
    let n = -5;
    if (n > 0) {
      document.write("Positive");
    } else if (n < 0) {
      document.write("Negative");
    } else {
      document.write("Zero");
    }
  </script>
</body>
</html>
