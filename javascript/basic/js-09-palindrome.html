<!-- JavaScript 9: Check whether a number is a palindrome. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palindrome</title>
</head>
<body>
  <script>
    let n = 121;
    let original = n;
    let reversed = 0;

    while (n > 0) {
      let digit = n % 10;
      reversed = reversed * 10 + digit;
      n = Math.floor(n / 10);
    }

    document.write(original === reversed ? original + " is palindrome" : original + " is not palindrome");
  </script>
</body>
</html>
