<!-- JavaScript 4: Check whether a number is even or odd. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Even or Odd</title>
</head>
<body>
  <script>
    let n = 7;
    if (n % 2 === 0) {
      document.write(n + " is even");
    } else {
      document.write(n + " is odd");
    }
  </script>
</body>
</html>
