<!doctype html><html><head><meta charset="UTF-8"><title>Event Capturing</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Event Capturing</h1><div id="outer" class="panel"><button id="inner">Click child</button></div><p id="out" class="output"></p></main><script>outer.addEventListener('click',()=>out.textContent='Parent captured event',true);inner.onclick=()=>out.textContent+=' Child handler'</script></body></html>
