<!doctype html><html><head><meta charset="UTF-8"><title>Reaction Game</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Reaction-time Game</h1><button id="button" onclick="finish()">Wait...</button><p id="out" class="output"></p></main><script>const started=performance.now();setTimeout(()=>button.textContent='Click now!',1000);function finish(){out.textContent=(performance.now()-started).toFixed(0)+' ms'}</script></body></html>
