<!doctype html><html><head><meta charset="UTF-8"><title>Remove Listener</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>removeEventListener()</h1><button id="button">Click</button><button onclick="button.removeEventListener('click',handler)">Remove handler</button><p id="out" class="output"></p></main><script>function handler(){out.textContent='Active handler'}button.addEventListener('click',handler)</script></body></html>
