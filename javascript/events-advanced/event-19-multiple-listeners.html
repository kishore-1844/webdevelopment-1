<!doctype html><html><head><meta charset="UTF-8"><title>Multiple Listeners</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Multiple Listeners on One Element</h1><button id="button">Click</button><p id="out" class="output"></p></main><script>button.addEventListener('click',()=>out.textContent='First listener');button.addEventListener('click',()=>out.textContent+=' and second listener')</script></body></html>
