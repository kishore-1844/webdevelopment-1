<!doctype html><html><head><meta charset="UTF-8"><title>Drag Drop</title><link rel="stylesheet" href="../dom-lab.css"><style>#drag{padding:20px;background:#dbeafe}#drop{padding:40px;border:2px dashed #2563eb;margin-top:15px}</style></head><body><main><h1>Drag-and-drop</h1><div id="drag" draggable="true">Drag me</div><div id="drop">Drop here</div><p id="out" class="output"></p></main><script>drop.ondragover=e=>e.preventDefault();drop.ondrop=()=>out.textContent='Dropped'</script></body></html>
