<!doctype html><html><head><meta charset="UTF-8"><title>Keyboard Object</title><link rel="stylesheet" href="../dom-lab.css"><style>#object{position:relative;background:#2563eb;color:#fff;padding:15px;width:90px}</style></head><body><main><h1>Keyboard-controlled Object</h1><div id="object">Move me</div></main><script>let x=0;document.onkeydown=e=>{if(e.key==='ArrowRight')x+=10;if(e.key==='ArrowLeft')x-=10;object.style.left=x+'px'}</script></body></html>
