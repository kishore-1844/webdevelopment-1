<!doctype html><html><head><meta charset="UTF-8"><title>Guessing Game</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Number Guessing Game</h1><section class="panel"><p>Guess a number from 1 to 10.</p><input id="guess" type="number" min="1" max="10"><button onclick="out.textContent=Number(guess.value)===secret?'Correct!':'Try again.'">Guess</button><div id="out" class="output"></div></section></main><script>const secret=Math.floor(Math.random()*10)+1</script></body></html>
