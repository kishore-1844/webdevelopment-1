<!doctype html><html><head><meta charset="UTF-8"><title>Countdown</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Countdown Timer</h1><section class="panel"><div id="time" class="output">10</div><button onclick="start()">Start countdown</button></section></main><script>let n=10;function start(){let timer=setInterval(()=>{time.textContent=--n;if(n<=0){clearInterval(timer);time.textContent='Finished!'}},1000)}</script></body></html>
