<!doctype html><html><head><meta charset="UTF-8"><title>Stopwatch</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Stopwatch</h1><p id="out" class="output">0 seconds</p><button onclick="timer=setInterval(()=>out.textContent=++n+' seconds',1000)">Start</button><button onclick="clearInterval(timer)">Stop</button></main><script>let n=0,timer</script></body></html>
