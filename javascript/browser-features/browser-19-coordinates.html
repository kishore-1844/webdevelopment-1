<!doctype html><html><head><meta charset="UTF-8"><title>Coordinates</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Current Geographical Coordinates</h1><button onclick="get()">Get coordinates</button><p id="out" class="output"></p></main><script>function get(){navigator.geolocation.getCurrentPosition(p=>out.textContent=`Latitude ${p.coords.latitude}, Longitude ${p.coords.longitude}`,e=>out.textContent=e.message)}</script></body></html>
