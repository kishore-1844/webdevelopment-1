<!doctype html><html><head><meta charset="UTF-8"><title>College Admission</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>College Admission Form</h1><form id="form" class="panel"><div class="field"><label>Student name<input required></label></div><div class="field"><label>Course<select required><option value="">Select course</option><option>BCA</option><option>BBA</option></select></label></div><div class="field"><label>Marks<input type="number" min="0" max="100" required></label></div><button>Apply</button><p id="out" class="output"></p></form></main><script>form.onsubmit=e=>{e.preventDefault();out.textContent=form.checkValidity()?'Application submitted':'Please enter valid details'}</script></body></html>
