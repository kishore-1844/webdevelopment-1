<!doctype html><html><head><meta charset="UTF-8"><title>Registration Validation</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Student Registration Validation</h1><form id="form" class="panel"><div class="field"><label>Name<input id="name" required></label></div><div class="field"><label>Email<input id="email" type="email" required></label></div><button>Register</button><p id="out" class="output"></p></form></main><script>form.onsubmit=e=>{e.preventDefault();out.textContent=form.checkValidity()?'Registration successful':'Complete all fields'}</script></body></html>
