<!doctype html><html><head><meta charset="UTF-8"><title>Feedback Validation</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Feedback Form</h1><form id="form" class="panel"><div class="field"><label>Rating<select required><option value="">Choose rating</option><option>5</option><option>4</option><option>3</option></select></label></div><textarea id="message" required placeholder="Your feedback"></textarea><button>Send feedback</button><p id="out" class="output"></p></form></main><script>form.onsubmit=e=>{e.preventDefault();out.textContent=form.checkValidity()?'Thank you for your feedback':'Please complete the form'}</script></body></html>
