<!doctype html><html><head><meta charset="UTF-8"><title>Dynamic Errors</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Dynamic Validation Errors</h1><form id="form" class="panel"><input id="email" type="email" placeholder="Email"><p id="error" class="error"></p><button>Submit</button></form></main><script>form.onsubmit=e=>{e.preventDefault();error.textContent=email.validity.valid?'':'Please enter a valid email without reloading the page'}</script></body></html>
