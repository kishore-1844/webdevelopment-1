<!doctype html><html><head><meta charset="UTF-8"><title>Login Validation</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Login Validation</h1><form id="form" class="panel"><div class="field"><label>Username<input id="user" required></label></div><div class="field"><label>Password<input id="pass" type="password" minlength="8" required></label></div><button>Log in</button><p id="out" class="output"></p></form></main><script>form.onsubmit=e=>{e.preventDefault();out.textContent=form.checkValidity()?'Login accepted':'Invalid username or password'}</script></body></html>
