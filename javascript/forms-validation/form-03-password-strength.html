<!doctype html><html><head><meta charset="UTF-8"><title>Password Strength</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Password Strength Checker</h1><input id="pass" type="password" oninput="check()"><p id="out" class="output"></p></main><script>function check(){let p=pass.value,s=0;s+=p.length>=8;s+=/[A-Z]/.test(p);s+=/[0-9]/.test(p);s+=/[^A-Za-z0-9]/.test(p);out.textContent=['Weak','Fair','Good','Strong','Excellent'][s]}</script></body></html>
