<!doctype html><html><head><meta charset="UTF-8"><title>Signup Confirmation</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Signup Password Confirmation</h1><form id="form" class="panel"><input id="one" type="password" placeholder="Password" required><input id="two" type="password" placeholder="Confirm password" required><button>Sign up</button><p id="out" class="output"></p></form></main><script>form.onsubmit=e=>{e.preventDefault();out.textContent=one.value===two.value?'Passwords match':'Passwords do not match'}</script></body></html>
