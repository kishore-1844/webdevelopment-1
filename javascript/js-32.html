<!doctype html><html><head><meta charset="UTF-8"><title>To-do List</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>To-do List</h1><section class="panel"><input id="task" placeholder="New task"><button onclick="add()">Add</button><ul id="list"></ul></section></main><script>function add(){if(task.value){list.innerHTML+=`<li>${task.value} <button onclick="this.parentElement.remove()">Done</button></li>`;task.value=''}}</script></body></html>
