<!doctype html><html><head><meta charset="UTF-8"><title>Add Elements</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Add Elements Dynamically</h1><section class="panel"><button onclick="add()">Add note</button><div id="notes"></div></section></main><script>function add(){const p=document.createElement('p');p.textContent='A new element was created at '+new Date().toLocaleTimeString();notes.appendChild(p)}</script></body></html>
