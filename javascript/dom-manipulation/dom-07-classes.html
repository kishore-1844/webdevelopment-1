<!doctype html><html><head><meta charset="UTF-8"><title>Dynamic Classes</title><link rel="stylesheet" href="../dom-lab.css"><style>.highlight{background:#fef3c7;padding:14px;border-radius:8px}</style></head><body><main><h1>Creating and Removing CSS Classes</h1><p id="text">Class target</p><button onclick="text.classList.add('highlight')">Add class</button><button onclick="text.classList.remove('highlight')">Remove class</button></main></body></html>
