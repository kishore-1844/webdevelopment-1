<!doctype html><html><head><meta charset="UTF-8"><title>Image Slideshow</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Image Slideshow</h1><img id="slide" width="100%" alt="Slideshow image"><div class="row"><button onclick="next(-1)">Previous</button><button onclick="next(1)">Next</button></div></main><script>const images=['https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=800&q=80','https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=800&q=80'];let i=0;slide.src=images[i];function next(step){i=(i+step+images.length)%images.length;slide.src=images[i]}</script></body></html>
