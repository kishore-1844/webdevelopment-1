<!doctype html><html><head><meta charset="UTF-8"><title>Query Selectors</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1 class="heading">querySelector and querySelectorAll</h1><ul><li>One</li><li>Two</li><li>Three</li></ul><button onclick="document.querySelector('.heading').textContent='First selector';document.querySelectorAll('li').forEach(e=>e.style.color='#2563eb')">Select elements</button></main></body></html>
