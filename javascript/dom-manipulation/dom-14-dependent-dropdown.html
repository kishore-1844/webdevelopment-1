<!doctype html><html><head><meta charset="UTF-8"><title>Dependent Dropdown</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Country, State, City Dropdown</h1><select id="country" onchange="loadStates()"><option>India</option><option>USA</option></select><select id="state" onchange="loadCities()"></select><select id="city"></select></main><script>const data={India:{Karnataka:['Bengaluru','Mysuru'],Maharashtra:['Mumbai','Pune']},USA:{California:['San Diego','Los Angeles'],Texas:['Austin','Dallas']}};function loadStates(){state.innerHTML='';Object.keys(data[country.value]).forEach(x=>state.add(new Option(x,x)));loadCities()}function loadCities(){city.innerHTML='';data[country.value][state.value].forEach(x=>city.add(new Option(x,x)))}loadStates()</script></body></html>
