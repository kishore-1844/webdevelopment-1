<!doctype html><html><head><meta charset="UTF-8"><title>Filter Table</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Search and Filter Table</h1><input id="search" oninput="filter()" placeholder="Search student"><table class="table"><tbody id="body"><tr><td>Riya</td><td>BCA</td></tr><tr><td>Aman</td><td>BBA</td></tr><tr><td>Neha</td><td>BSc</td></tr></tbody></table></main><script>function filter(){const q=search.value.toLowerCase();body.querySelectorAll('tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q))}</script></body></html>
