<!doctype html><html><head><meta charset="UTF-8"><title>Table Rows</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Add and Delete Table Rows</h1><button onclick="addRow()">Add row</button><table class="table"><tbody id="body"><tr><td>Existing row</td><td><button onclick="this.closest('tr').remove()">Delete</button></td></tr></tbody></table></main><script>function addRow(){body.innerHTML+=`<tr><td>New row</td><td><button onclick="this.closest('tr').remove()">Delete</button></td></tr>`}</script></body></html>
