<!doctype html><html><head><meta charset="UTF-8"><title>Search Table</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Searchable Table</h1><input id="q" oninput="filter()" placeholder="Search"><table class="table"><tbody id="body"><tr><td>Analytics</td><td>Active</td></tr><tr><td>Billing</td><td>Paused</td></tr></tbody></table></main><script>function filter(){body.querySelectorAll('tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q.value.toLowerCase()))}</script></body></html>
