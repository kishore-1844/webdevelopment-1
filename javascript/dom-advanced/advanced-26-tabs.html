<!doctype html><html><head><meta charset="UTF-8"><title>DOM Tabs</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Tabs Interface</h1><div class="row"><button onclick="show('one')">Overview</button><button onclick="show('two')">Activity</button></div><p id="one" class="panel">Overview content</p><p id="two" class="panel hidden">Activity content</p></main><script>function show(id){one.classList.add('hidden');two.classList.add('hidden');document.getElementById(id).classList.remove('hidden')}</script></body></html>
