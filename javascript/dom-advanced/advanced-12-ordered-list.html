<!doctype html><html><head><meta charset="UTF-8"><title>Dynamic Ordered List</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Dynamic Ordered List</h1><input id="item"><button onclick="add()">Add step</button><ol id="list"></ol></main><script>function add(){if(item.value){list.innerHTML+=`<li>${item.value}</li>`;item.value=''}}</script></body></html>
