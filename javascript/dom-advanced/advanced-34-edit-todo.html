<!doctype html><html><head><meta charset="UTF-8"><title>Edit Todo</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Add, Edit, Delete Todo Items</h1><input id="task"><button onclick="add()">Add</button><ul id="list"></ul></main><script>function add(){if(!task.value)return;list.innerHTML+=`<li>${task.value} <button onclick="this.parentElement.firstChild.textContent=prompt('Edit item',this.parentElement.firstChild.textContent)">Edit</button><button onclick="this.parentElement.remove()">Delete</button></li>`;task.value=''}</script></body></html>
