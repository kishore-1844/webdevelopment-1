<!doctype html><html><head><meta charset="UTF-8"><title>Create Element</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Create and Append Element</h1><button onclick="add()">Create card</button><div id="list"></div></main><script>function add(){const el=document.createElement('article');el.className='card';el.textContent='New card';list.appendChild(el)}</script></body></html>
