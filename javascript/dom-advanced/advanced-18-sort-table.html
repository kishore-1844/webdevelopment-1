<!doctype html><html><head><meta charset="UTF-8"><title>Sort Table</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Sort Table Records</h1><button onclick="sort()">Sort by score</button><table class="table"><tbody id="body"><tr><td>Riya</td><td>72</td></tr><tr><td>Aman</td><td>91</td></tr><tr><td>Neha</td><td>84</td></tr></tbody></table></main><script>function sort(){[...body.rows].sort((a,b)=>b.cells[1].textContent-a.cells[1].textContent).forEach(r=>body.appendChild(r))}</script></body></html>
