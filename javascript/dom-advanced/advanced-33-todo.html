<!doctype html><html><head><meta charset="UTF-8"><title>DOM Todo</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Todo with DOM Manipulation</h1><input id="task"><button onclick="add()">Add</button><ul id="list"></ul></main><script>function add(){const li=document.createElement('li');li.textContent=task.value;list.appendChild(li);task.value=''}</script></body></html>
