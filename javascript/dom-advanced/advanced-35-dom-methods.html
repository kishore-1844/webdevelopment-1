<!doctype html><html><head><meta charset="UTF-8"><title>Core DOM Methods</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>createElement, appendChild, remove, replaceChild</h1><section id="root" class="panel"><p id="old">Original node</p></section><button onclick="run()">Run methods</button></main><script>function run(){const n=document.createElement('p');n.textContent='Appended node';root.appendChild(n);old.replaceWith(Object.assign(document.createElement('p'),{textContent:'Replaced node'}));n.remove()}</script></body></html>
