<!doctype html><html><head><meta charset="UTF-8"><title>Vowels Consonants</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Count Vowels and Consonants</h1><p id="out" class="output"></p></main><script>const text='JavaScript';const vowels=(text.match(/[aeiou]/gi)||[]).length;out.textContent=`Vowels: ${vowels} | Consonants: ${text.replace(/[^a-z]/gi,'').length-vowels}`</script></body></html>
