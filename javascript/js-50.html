<!doctype html><html><head><meta charset="UTF-8"><title>LCM</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Least Common Multiple</h1><p id="out" class="output"></p></main><script>function gcd(a,b){while(b)[a,b]=[b,a%b];return a}const a=12,b=18;out.textContent=`LCM of ${a} and ${b}: ${a*b/gcd(a,b)}`</script></body></html>
