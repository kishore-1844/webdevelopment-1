<!doctype html><html><head><meta charset="UTF-8"><title>Form Validation</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Form Validation</h1><form id="form" class="panel"><div class="field"><label>Name<input id="name" required></label></div><div class="field"><label>Email<input id="email" type="email" required></label></div><button>Validate</button><p id="out" class="output"></p></form></main><script>form.onsubmit=e=>{e.preventDefault();out.textContent=form.checkValidity()?'Form is valid.':'Please complete the fields.'}</script></body></html>
