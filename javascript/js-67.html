<!doctype html><html><head><meta charset="UTF-8"><title>Email Regex</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Validate Email with Regular Expression</h1><section class="panel"><input id="email" value="student@example.com"><button onclick="out.textContent=/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email.value)?'Valid email':'Invalid email'">Validate</button><p id="out" class="output"></p></section></main></body></html>
