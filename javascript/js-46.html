<!doctype html><html><head><meta charset="UTF-8"><title>Responsive Login</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Responsive Login Validation</h1><form id="form" class="panel"><div class="field"><label>Email<input id="email" type="email" required></label></div><div class="field"><label>Password<input id="password" type="password" minlength="8" required></label></div><button>Log in</button><p id="out" class="output"></p></form></main><script>form.onsubmit=e=>{e.preventDefault();out.textContent=form.checkValidity()?'Login accepted':'Enter a valid email and 8-character password'}</script></body></html>
