<!doctype html><html><head><meta charset="UTF-8"><title>Validate User Details</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Validate Name, Email, Phone, Password</h1><form id="form" class="panel"><div class="field"><label>Name<input id="name" required></label></div><div class="field"><label>Email<input id="email" type="email" required></label></div><div class="field"><label>Phone<input id="phone" pattern="[0-9]{10}" required></label></div><div class="field"><label>Password<input id="password" type="password" minlength="8" required></label></div><button>Validate</button><p id="out" class="output"></p></form></main><script>form.onsubmit=e=>{e.preventDefault();out.textContent=form.checkValidity()?'All details are valid.':'Check the highlighted fields.'}</script></body></html>
