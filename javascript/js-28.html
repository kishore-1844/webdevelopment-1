<!doctype html><html><head><meta charset="UTF-8"><title>Calculator</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Simple Calculator</h1><section class="panel"><input id="a" type="number" value="8"> <select id="op"><option>+</option><option>-</option><option>*</option><option>/</option></select> <input id="b" type="number" value="4"><button onclick="out.textContent=Function('return '+a.value+op.value+b.value)()">Calculate</button><div id="out" class="output"></div></section></main></body></html>
