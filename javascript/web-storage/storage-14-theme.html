<!doctype html><html><head><meta charset="UTF-8"><title>Theme Storage</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Dark Light Theme with localStorage</h1><button onclick="toggle()">Toggle theme</button></main><script>function toggle(){document.body.classList.toggle('dark');localStorage.theme=document.body.classList.contains('dark')?'dark':'light'}if(localStorage.theme==='dark')document.body.classList.add('dark')</script></body></html>
