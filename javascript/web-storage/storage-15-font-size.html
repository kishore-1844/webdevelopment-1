<!doctype html><html><head><meta charset="UTF-8"><title>Font Preference</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Saved Font Size</h1><button onclick="setSize('18px')">Large text</button><button onclick="setSize('15px')">Normal text</button><p>Font preference is stored locally.</p></main><script>function setSize(x){document.body.style.fontSize=x;localStorage.fontSize=x}document.body.style.fontSize=localStorage.fontSize||'15px'</script></body></html>
