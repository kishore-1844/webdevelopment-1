<!doctype html><html><head><meta charset="UTF-8"><title>Recently Viewed</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Recently Viewed Items</h1><button onclick="view('Analytics report')">View report</button><button onclick="view('Billing dashboard')">View billing</button><p id="out" class="output"></p></main><script>function view(x){let a=JSON.parse(localStorage.recent||'[]');a=[x,...a.filter(y=>y!==x)].slice(0,5);localStorage.recent=JSON.stringify(a);out.textContent=a.join(' · ')}</script></body></html>
