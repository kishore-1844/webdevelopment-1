<!doctype html><html><head><meta charset="UTF-8"><title>Stored Todo</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Todo List with localStorage</h1><input id="task"><button onclick="add()">Add</button><ul id="list"></ul></main><script>let todos=JSON.parse(localStorage.todos||'[]');function render(){list.innerHTML=todos.map(x=>`<li>${x}</li>`).join('')}function add(){todos.push(task.value);localStorage.todos=JSON.stringify(todos);task.value='';render()}render()</script></body></html>
