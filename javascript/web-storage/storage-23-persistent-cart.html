<!doctype html><html><head><meta charset="UTF-8"><title>Persistent Cart</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Cart Persists after Refresh</h1><button onclick="add('Product')">Add product</button><p id="out" class="output"></p></main><script>let cart=JSON.parse(localStorage.persistentCart||'[]');function add(x){cart.push(x);localStorage.persistentCart=JSON.stringify(cart);render()}function render(){out.textContent=cart.join(', ')||'Empty cart'}render()</script></body></html>
