<!doctype html><html><head><meta charset="UTF-8"><title>Stored Cart</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Shopping Cart with localStorage</h1><button onclick="add('Notebook')">Add notebook</button><button onclick="add('Pen')">Add pen</button><p id="out" class="output"></p></main><script>let cart=JSON.parse(localStorage.cart||'[]');function add(x){cart.push(x);localStorage.cart=JSON.stringify(cart);out.textContent=cart.join(', ')}</script></body></html>
