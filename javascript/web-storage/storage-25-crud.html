<!doctype html><html><head><meta charset="UTF-8"><title>localStorage CRUD</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>localStorage CRUD Application</h1><input id="value" placeholder="Record"><button onclick="create()">Create</button><ul id="list"></ul></main><script>let records=JSON.parse(localStorage.records||'[]');function render(){list.innerHTML=records.map((x,i)=>`<li>${x} <button onclick="edit(${i})">Edit</button><button onclick="del(${i})">Delete</button></li>`).join('')}function save(){localStorage.records=JSON.stringify(records);render()}function create(){records.push(value.value);save();value.value=''}function edit(i){records[i]=prompt('Update record',records[i]);save()}function del(i){records.splice(i,1);save()}render()</script></body></html>
