<!doctype html><html><head><meta charset="UTF-8"><title>Counter</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Counter Application</h1><section class="panel"><div id="count" class="output" style="font-size:2rem">0</div><button onclick="count.textContent=Number(count.textContent)+1">Increment</button><button onclick="count.textContent=Number(count.textContent)-1">Decrement</button></section></main></body></html>
