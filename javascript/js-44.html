<!doctype html><html><head><meta charset="UTF-8"><title>Dynamic API Data</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Display API Data Dynamically</h1><button onclick="load()">Load users</button><ul id="list"></ul></main><script>async function load(){const r=await fetch('https://jsonplaceholder.typicode.com/users?_limit=5');(await r.json()).forEach(u=>list.innerHTML+=`<li>${u.name} · ${u.email}</li>`)}</script></body></html>
