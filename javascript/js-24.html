<!doctype html><html><head><meta charset="UTF-8"><title>Click Event</title><link rel="stylesheet" href="js-lab.css"></head><body><main><h1>Button Click Event</h1><button id="button">Click me</button><p id="out" class="output"></p></main><script>button.addEventListener('click',()=>out.textContent='The button was clicked at '+new Date().toLocaleTimeString())</script></body></html>
