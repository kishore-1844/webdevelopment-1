<!doctype html><html><head><meta charset="UTF-8"><title>Expense Tracker</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Expense Tracker</h1><input id="amount" type="number" placeholder="Amount"><button onclick="add()">Add expense</button><p id="out" class="output">Total: $0</p></main><script>let total=0;function add(){total+=Number(amount.value);out.textContent='Total: $'+total}</script></body></html>
