<!doctype html><html><head><meta charset="UTF-8"><title>BMI Calculator</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>BMI Calculator</h1><input id="weight" type="number" placeholder="Weight kg"><input id="height" type="number" placeholder="Height m"><button onclick="out.textContent=(weight.value/(height.value**2)).toFixed(2)">Calculate BMI</button><p id="out" class="output"></p></main></body></html>
