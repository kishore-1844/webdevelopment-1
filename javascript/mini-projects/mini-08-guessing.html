<!doctype html><html><head><meta charset="UTF-8"><title>Guessing Game</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Number Guessing Game</h1><input id="guess" type="number"><button onclick="out.textContent=+guess.value===secret?'Correct!':'Try again'">Guess</button><p id="out" class="output"></p></main><script>const secret=Math.ceil(Math.random()*10)</script></body></html>
