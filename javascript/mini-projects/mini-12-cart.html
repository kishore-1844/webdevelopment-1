<!doctype html><html><head><meta charset="UTF-8"><title>Shopping Cart</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Simple Shopping Cart</h1><button onclick="add('Notebook',5)">Add notebook $5</button><button onclick="add('Pen',2)">Add pen $2</button><ul id="list"></ul><p id="total" class="output">Total: $0</p></main><script>let sum=0;function add(name,price){sum+=price;list.innerHTML+=`<li>${name} - $${price}</li>`;total.textContent='Total: $'+sum}</script></body></html>
