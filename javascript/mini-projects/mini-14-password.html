<!doctype html><html><head><meta charset="UTF-8"><title>Password Generator</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Random Password Generator</h1><button onclick="generate()">Generate password</button><p id="out" class="output"></p></main><script>function generate(){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#';out.textContent=Array.from({length:12},()=>chars[Math.floor(Math.random()*chars.length)]).join('')}</script></body></html>
