<!doctype html><html><head><meta charset="UTF-8"><title>Stopwatch</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Stopwatch</h1><div id="time" class="output">0</div><button onclick="run()">Start</button><button onclick="clearInterval(timer)">Stop</button></main><script>let n=0,timer;function run(){timer=setInterval(()=>time.textContent=++n+' seconds',1000)}</script></body></html>
