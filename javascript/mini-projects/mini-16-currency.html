<!doctype html><html><head><meta charset="UTF-8"><title>Currency Converter</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Currency Converter API</h1><input id="amount" type="number" value="100"><button onclick="convert()">Convert EUR to USD</button><p id="out" class="output"></p></main><script>async function convert(){const r=await fetch('https://open.er-api.com/v6/latest/EUR');const d=await r.json();out.textContent=(amount.value*d.rates.USD).toFixed(2)+' USD'}</script></body></html>
