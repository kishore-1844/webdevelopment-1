<!doctype html><html><head><meta charset="UTF-8"><title>Weather API</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>Weather Application</h1><p class="muted">Demo API request using a public endpoint.</p><button onclick="load()">Load weather data</button><p id="out" class="output"></p></main><script>async function load(){const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=12.97&longitude=77.59&current=temperature_2m');const d=await r.json();out.textContent='Bengaluru temperature: '+d.current.temperature_2m+'°C'}</script></body></html>
