<!doctype html><html><head><meta charset="UTF-8"><title>Todo Application</title><link rel="stylesheet" href="../dom-lab.css"></head><body><main><h1>To-do List Application</h1><input id="task"><button onclick="add()">Add</button><ul id="list"></ul></main><script>function add(){if(task.value){list.innerHTML+=`<li>${task.value} <button onclick="this.parentElement.remove()">Done</button></li>`;task.value=''}}</script></body></html>
