<!doctype html><html><head><meta charset="UTF-8"><title>Tic Tac Toe</title><link rel="stylesheet" href="../dom-lab.css"><style>.board{display:grid;grid-template-columns:repeat(3,70px);gap:5px}.board button{height:70px;font-size:25px}</style></head><body><main><h1>Tic-tac-toe</h1><div id="board" class="board"></div><p id="out" class="output">X's turn</p></main><script>let turn='X';for(let i=0;i<9;i++){const b=document.createElement('button');b.onclick=()=>{if(!b.textContent){b.textContent=turn;turn=turn==='X'?'O':'X';out.textContent=turn+"'s turn"}};board.appendChild(b)}</script></body></html>
